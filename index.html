<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>exoGAME - Top Up Game Murah & Cepat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body {
      color: #f3f4f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      background-color: #080314;
    }

    /* Fixed Canvas for Animated Background */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(236, 72, 153, 0.2);
    }

    .glass-card:hover {
      border-color: rgba(236, 72, 153, 0.6);
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.25);
    }

    .glass-header {
      background: rgba(15, 10, 30, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(236, 72, 153, 0.2);
    }

    /* Sidebar Alphabet A-Z */
    .alphabet-sidebar {
      position: fixed;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      background: rgba(15, 10, 30, 0.85);
      backdrop-filter: blur(10px);
      padding: 6px 4px;
      border-radius: 12px;
      border: 1px solid rgba(236, 72, 153, 0.3);
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    .alphabet-sidebar button {
      font-size: 10px;
      font-weight: bold;
      color: #9ca3af;
      padding: 1px 4px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .alphabet-sidebar button:hover, .alphabet-sidebar button.active {
      color: #ec4899;
      background-color: rgba(236, 72, 153, 0.3);
      text-shadow: 0 0 8px #ec4899;
    }

    /* Selection Highlighting */
    .nominal-btn.selected, .payment-btn.selected {
      border-color: #ec4899 !important;
      background-color: rgba(236, 72, 153, 0.25) !important;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
      transform: translateY(-2px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090514;
    }
    ::-webkit-scrollbar-thumb {
      background: #ec4899;
      border-radius: 10px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pr-8 sm:pr-10">

  <!-- Interactive Animated Background Canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- Main Container -->
  <div class="relative z-10 flex-1 flex flex-col justify-between">
    
    <!-- Alphabet Sidebar -->
    <div class="alphabet-sidebar" id="alphabetSidebar"></div>

    <!-- Header / Navbar -->
    <header class="glass-header sticky top-0 z-50 transition-all duration-300">
      <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
        <!-- Logo -->
        <div class="flex items-center gap-2 cursor-pointer" onclick="showCatalog()">
          <span class="text-2xl font-black tracking-wider text-pink-500 drop-shadow-[0_0_10px_rgba(236,72,153,0.8)]">
            exo<span class="text-white">GAME</span>
          </span>
        </div>

        <!-- Controls: Effect & Search -->
        <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
          
          <!-- Background Effect Selector -->
          <div class="flex items-center bg-gray-900/80 border border-pink-500/40 rounded-full px-2.5 py-1 text-xs text-gray-300 gap-1.5 shadow-lg">
            <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i>
            <span class="text-gray-400">Effect:</span>
            <select id="bgEffectSelect" onchange="changeBgEffect(this.value)" class="bg-transparent text-pink-300 font-semibold focus:outline-none cursor-pointer text-xs">
              <option value="nebula" class="bg-gray-900 text-white">✨ Glowing Nebula</option>
              <option value="particles" class="bg-gray-900 text-white">🌌 Particle Network</option>
              <option value="cyber" class="bg-gray-900 text-white">🟩 Matrix Cyber Grid</option>
            </select>
          </div>

          <!-- Search Bar -->
          <div class="relative">
            <input type="text" id="searchInput" onkeyup="filterAndSortGames()" placeholder="Cari game di exoGAME..." class="bg-gray-900/90 border border-gray-700/80 px-4 py-1.5 pl-8 rounded-full text-xs sm:text-sm text-white focus:outline-none focus:border-pink-500 w-36 sm:w-48 transition-all">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-gray-400 text-xs"></i>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 mb-12 w-full">
      
      <!-- Hero Banner -->
      <div class="relative overflow-hidden rounded-2xl p-6 sm:p-8 mb-8 shadow-2xl border border-pink-500/30 bg-gradient-to-r from-purple-900/80 via-pink-900/60 to-indigo-950/80 backdrop-blur-md">
        <div class="relative z-10 max-w-2xl">
          <h1 class="text-2xl sm:text-4xl font-extrabold mb-2 text-white drop-shadow-md">
            TOP UP GAME INSTAN HARGA TERMURAH
          </h1>
          <p class="text-xs sm:text-sm text-gray-300 leading-relaxed mb-2">
            Nikmati top up diamond, voucher, dan membership favoritmu dengan efek animasi live wallpaper interaktif.
          </p>
          <p class="text-[11px] text-pink-300/80 italic">
            Gerakkan kursor di layar untuk melihat interaksi efek background!
          </p>
        </div>
        <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-pink-500/30 rounded-full blur-3xl pointer-events-none"></div>
      </div>

      <!-- CATALOG SECTION -->
      <section id="catalogSection">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 glass-card p-4 rounded-xl">
          <h2 class="text-lg sm:text-xl font-bold text-gray-100 border-l-4 border-pink-500 pl-3 flex items-center gap-2">
            <i class="fa-solid fa-gamepad text-pink-500"></i> Katalog Game Top-Up
          </h2>
          
          <div class="flex items-center gap-3">
            <label for="sortSelect" class="text-xs sm:text-sm font-medium text-gray-400 whitespace-nowrap">Urutkan:</label>
            <select id="sortSelect" onchange="filterAndSortGames()" class="bg-gray-900/90 border border-gray-700 text-xs sm:text-sm rounded-lg px-3 py-1.5 text-white focus:outline-none focus:border-pink-500 cursor-pointer">
              <option value="az">Urutan Abjad (A - Z)</option>
              <option value="za">Urutan Abjad (Z - A)</option>
              <option value="default">Populer / Rekomendasi</option>
            </select>
          </div>
        </div>
        
        <!-- Game Cards Grid (Rasio Foto 1:1) -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4" id="gameGrid">
          
          <!-- Mobile Legends -->
          <div class="game-card glass-card rounded-2xl overflow-hidden transition-all duration-300 hover:-translate-y-1.5 cursor-pointer flex flex-col group border border-purple-900/50 hover:border-pink-500/60" data-title="Mobile Legends: Bang Bang" onclick="openTopup('mlbb', 'Mobile Legends: Bang Bang', '
