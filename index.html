<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>exoGAME - Top Up Game Murah & Cepat</title>
  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d021a;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 1. ANIMASI BACKGROUND GERAK (EFEK PARTIKEL & ORB NEON) */
    .animated-bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      overflow: hidden;
      background: linear-gradient(135deg, #0d021a 0%, #17052e 50%, #090114 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: floatOrb 12s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 350px;
      height: 350px;
      background: #7c3aed;
      top: -50px;
      left: -50px;
    }

    .orb-2 {
      width: 450px;
      height: 450px;
      background: #c084fc;
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: #2563eb;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -8s;
    }

    @keyframes floatOrb {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(60px, 80px) scale(1.2);
      }
      100% {
        transform: translate(-40px, 40px) scale(0.9);
      }
    }

    /* 2. BACKGROUND VIDEO (JIKA KAMU UNGGAT FILE MP4 SENDIRI) */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      display: none;
    }

    /* OVERLAY AGAR KONTEN TETAP JELAS DIBACA */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 2, 26, 0.45);
      z-index: -1;
    }

    /* NAVBAR & HEADER */
    header {
      background: rgba(22, 5, 43, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #e0b0ff;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .logo span {
      color: #00ffcc;
    }

    /* UPLOADER WALLPAPER */
    .bg-uploader {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .bg-uploader label {
      cursor: pointer;
      color: #00ffcc;
      font-weight: 600;
    }

    .bg-uploader input[type="file"] {
      display: none;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* GRID KARTU GAME */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
    }

    /* KARTU GAME SAMA SEPERTI REFERENSI FOTO */
    .game-card {
      background: #2b1248;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 25px rgba(168, 85, 247, 0.4);
    }

    /* CONTAINER GAMBAR (PERSEGI 1:1) */
    .poster-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #1a0830;
    }

    .poster-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* BADGE PROMO */
    .badge-discount {
      position: absolute;
      top: 0;
      left: 0;
      background: #eab308;
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 20px;
      transform: rotate(-45deg) translate(-18px, -12px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
      width: 90px;
      z-index: 2;
    }

    .badge-max {
      position: absolute;
      top: 0;
      left: 0;
      background: #f97316;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 20px;
      transform: rotate(-45deg) translate(-18px, -12px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
      width: 90px;
      z-index: 2;
    }

    /* GELOMBANG (WAVY DIVIDER) */
    .wavy-divider {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      line-height: 0;
      z-index: 2;
    }

    .wavy-divider svg {
      position: relative;
      display: block;
      width: 100%;
      height: 16px;
      fill: #2b1248;
    }

    /* JUDUL GAME */
    .game-title {
      padding: 10px 8px 14px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* FOOTER */
    footer {
      margin-top: 60px;
      background: rgba(15, 3, 30, 0.9);
      padding: 25px;
      text-align: center;
      font-size: 13px;
      color: #a0aec0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>

  <!-- BACKGROUND BERGERAK (EFEK ORB & NEON GLOW) -->
  <div class="animated-bg-container">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- OVERLAY MENTERANGKAN TEKS -->
  <div class="bg-overlay"></div>

  <!-- BACKGROUND VIDEO JIKA DI-UPLOAD KONSUMEN -->
  <video id="bgVideo" autoplay muted loop playsinline></video>

  <!-- NAVBAR -->
  <header>
    <a href="#" class="logo">exo<span>GAME</span></a>
    
    <div class="bg-uploader">
      <span>Ganti Video Wallpaper:</span>
      <label for="bgInput">📁 Upload MP4/GIF</label>
      <input type="file" id="bgInput" accept="video/mp4, video/webm, image/gif" />
    </div>
  </header>

  <!-- CONTENT -->
  <div class="container">
    <div class="section-title">⚡ Top Up Game Populer</div>

    <div class="game-grid">

      <!-- 1. Mobile Legends -->
      <div class="game-card">
        <div class="poster-container">
          <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400&auto=format&fit=crop&q=80" alt="Mobile Legends" />
          <div class="wavy-divider">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
              <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118.06,150.2,112.55,214.5,102.32A782.3,782.3,0,0,0,321.39,56.44Z"></path>
            </svg>
          </div>
        </div>
        <div class="game-title">Mobile Legends: Bang Bang</div>
      </div>

      <!-- 2. Free Fire Top-up -->
      <div class="game-card">
        <div class="poster-container">
          <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400&auto=format&fit=crop&q=80" alt="Free Fire" />
          <div class="wavy-divider">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
              <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118.06,150.2,112.55,214.5,102.32A782.3,782.3,0,0,0,321.39,56.44Z"></path>
            </svg>
          </div>
        </div>
        <div class="game-title">Free Fire Top-up</div>
      </div>

      <!-- 3. Magic Chess -->
      <div class="game-card">
        <div class="poster-container">
          <div class="badge-discount">Diskon 10%</div>
          <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400&auto=format&fit=crop&q=80" alt="Magic Chess" />
          <div class="wavy-divider">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
              <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118.06,150.2,112.55,214.5,102.32A782.3,782.3,0,0,0,321.39,56.44Z"></path>
            </svg>
          </div>
        </div>
        <div class="game-title">Magic Chess: Go Go</div>
      </div>

      <!-- 4. Free Fire MAX -->
      <div class="game-card">
        <div class="poster-container">
          <div class="badge-max">MAX</div>
          <img src="https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=400&auto=format&fit=crop&q=80" alt="Free Fire MAX" />
          <div class="wavy-divider">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
              <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118.06,150.2,112.55,214.5,102.32A782.3,782.3,0,0,0,321.39,56.44Z"></path>
            </svg>
          </div>
        </div>
        <div class="game-title">Free Fire MAX Top-up</div>
      </div>

      <!-- 5. Call of Duty Mobile -->
      <div class="game-card">
        <div class="poster-container">
          <img src="https://images.unsplash.com/photo-1589241062272-c0a000072dfa?w=400&auto=format&fit=crop&q=80" alt="CODM" />
          <div class="wavy-divider">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
              <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118.06,150.2,112.55,214.5,102.32A782.3,782.3,0,0,0,321.39,56.44Z"></path>
            </svg>
          </div>
        </div>
        <div class="game-title">Call of Duty Mobile</div>
      </div>

      <!-- 6. Hago -->
      <div class="game-card">
        <div class="poster-container">
          <img src="https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=400&auto=format&fit=crop&q=80" alt="Hago" />
          <div class="wavy-divider">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
              <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118.06,150.2,112.55,214.5,102.32A782.3,782.3,0,0,0,321.39,56.44Z"></path>
            </svg>
          </div>
        </div>
        <div class="game-title">Hago</div>
      </div>

    </div>
  </div>

  <footer>
    &copy; 2026 exoGAME. All rights reserved.
  </footer>

  <script>
    const bgInput = document.getElementById('bgInput');
    const bgVideo = document.getElementById('bgVideo');

    bgInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        bgVideo.src = fileURL;
        bgVideo.style.display = 'block';
        bgVideo.play();
      }
    });
  </script>
</body>
</html>
