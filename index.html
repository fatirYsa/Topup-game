<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>exoGAME - Top Up Game Murah & Cepat</title>
  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #120326;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* BACKGROUND VIDEO & FALLBACK ANIMATION */
    #bgVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      display: none; /* Muncul jika file video dimasukkan */
    }

    .animated-bg-default {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 30%, #3a0d66 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, #200440 0%, transparent 50%),
                  linear-gradient(135deg, #100220 0%, #1a0333 100%);
      background-size: 200% 200%;
      animation: gradientMove 10s ease infinite;
      z-index: -3;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* HEADER & NAVBAR */
    header {
      background: rgba(22, 5, 43, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #e0b0ff;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .logo span {
      color: #00ffcc;
    }

    /* FITUR DASHBOARD/SETTINGS BACKGROUND */
    .bg-uploader {
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .bg-uploader label {
      cursor: pointer;
      color: #00ffcc;
      font-weight: 600;
    }

    .bg-uploader input[type="file"] {
      display: none;
    }

    /* CONTAINER UTAMA */
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* GRID KARTU GAME (Sesuai Referensi Foto) */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
    }

    /* KARTU GAME */
    .game-card {
      background: #2b1248; /* Warna latar belakang label bawah */
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 25px rgba(168, 85, 247, 0.3);
    }

    /* CONTAINER GAMBAR (PERSEGI 1:1) */
    .poster-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1; /* Rasio Persegi Sesuai Foto Referensi */
      overflow: hidden;
      background: #1a0830;
    }

    .poster-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* BADGE DISKON / PROMO */
    .badge-discount {
      position: absolute;
      top: 0;
      left: 0;
      background: #eab308;
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 20px;
      transform: rotate(-45deg) translate(-18px, -12px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
      width: 90px;
      z-index: 2;
    }

    .badge-max {
      position: absolute;
      top: 0;
      left: 0;
      background: #f97316;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 20px;
      transform: rotate(-45deg) translate(-18px, -12px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
      width: 90px;
      z-index: 2;
    }

    /* EFEK GELOMBANG (WAVY SEPARATOR) */
    .wavy-divider {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      line-height: 0;
      z-index: 2;
    }

    .wavy-divider svg {
      position: relative;
      display: block;
      width: 100%;
      height: 16px;
      fill: #2b1248; /* Samakan dengan warna .game-card */
    }

    /* NAMA GAME / LABEL BAWAH */
    .game-title {
      padding: 10px 8px 14px 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* FOOTER */
    footer {
      margin-top: 60px;
      background: rgba(15, 3, 30, 0.9);
      padding: 25px;
      text-align: center;
      font-size: 13px;
      color: #a0aec0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

  <!-- SCRIPT UNTUK MEMANGGIL VIDEO BACKGROUND MILIK SENDIRI -->
  <script>
    const bgInput = document.getElementById('bgInput');
    const bgVideo = document.getElementById('bgVideo');

    bgInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        bgVideo.src = fileURL;
        bgVideo.style.display = 'block';
        bgVideo.play();
      }
    });
  </script>
